kind = "web"
previewPath = "/"
title = "EduManage — School SaaS"
version = "1.0.0"
id = "artifacts/school-saas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23607

[services.development]
run = "pnpm --filter @workspace/school-saas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/school-saas", "run", "build" ]
publicDir = "artifacts/school-saas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23607"
BASE_PATH = "/"
