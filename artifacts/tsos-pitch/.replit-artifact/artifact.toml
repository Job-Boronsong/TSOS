kind = "slides"
previewPath = "/tsos-pitch/"
title = "TSOS Pitch Deck"
version = "1.0.0"
id = "artifacts/tsos-pitch"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/tsos-pitch/" ]
localPort = 21678

[services.development]
run = "pnpm --filter @workspace/tsos-pitch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tsos-pitch", "run", "build" ]
publicDir = "artifacts/tsos-pitch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21678"
BASE_PATH = "/tsos-pitch/"
