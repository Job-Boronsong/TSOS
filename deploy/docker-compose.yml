services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tsos
      POSTGRES_USER: tsos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsos -d tsos"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # MinIO console — bind to localhost only, access via SSH tunnel
      - "127.0.0.1:9001:9001"

  minio-init:
    # Use Alpine + download mc binary directly — avoids glibc x86-64-v2 CPU
    # requirement that minio/mc:latest has (breaks on older VPS CPUs).
    # The mc binary is pure Go (statically compiled) and runs on any x86-64.
    image: alpine:3.19
    restart: no
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache curl &&
        curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc &&
        chmod +x /usr/local/bin/mc &&
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD 2>/dev/null; do
          echo 'Waiting for MinIO...'; sleep 3;
        done &&
        mc mb --ignore-existing local/tsos-public &&
        mc mb --ignore-existing local/tsos-private &&
        mc anonymous set download local/tsos-public &&
        echo 'MinIO buckets ready.'
      "

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migrate
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tsos:${POSTGRES_PASSWORD}@postgres:5432/tsos

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      # Bound to localhost only — system nginx proxies in from outside
      - "127.0.0.1:8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://tsos:${POSTGRES_PASSWORD}@postgres:5432/tsos
      SESSION_SECRET: ${SESSION_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PUBLIC_OBJECT_SEARCH_PATHS: /tsos-public
      PRIVATE_OBJECT_DIR: /tsos-private
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      # Bound to localhost only — system nginx proxies in from outside
      - "127.0.0.1:8082:80"

volumes:
  postgres_data:
  minio_data:
